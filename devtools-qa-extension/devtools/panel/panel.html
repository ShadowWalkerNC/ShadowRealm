<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA & Fault Injection Panel</title>
  <style>
    :root {
      --bg: #18181b;
      --panel: #27272a;
      --border: #3f3f46;
      --accent: #50fa7b;
      --danger: #ff5555;
      --warning: #ffb86c;
      --fg: #f8f8f2;
      --muted: #a1a1aa;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      box-sizing: border-box;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    input[type="text"], select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--fg);
      padding: 8px;
      font-size: 12px;
      font-family: Consolas, monospace;
      outline: none;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.9;
    }

    button.secondary {
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
    }

    button.danger {
      background: var(--danger);
      color: #fff;
    }

    .log-container {
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: Consolas, monospace;
      font-size: 11px;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .log-item.error {
      border-left: 3px solid var(--danger);
    }

    .log-item.success {
      border-left: 3px solid var(--accent);
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
    }

    .badge.block { background: rgba(255, 85, 85, 0.2); color: var(--danger); }
    .badge.redirect { background: rgba(255, 184, 108, 0.2); color: var(--warning); }
  </style>
</head>
<body>
  <h3>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
    DevTools QA &amp; Fault Injection Workbench
  </h3>

  <div class="grid">
    <!-- 1. Network Fault Injection (DNR Rules) -->
    <div class="card">
      <div class="card-title">
        <span>⚡ Network Fault Injection (DNR)</span>
        <span class="badge" id="active-rules-count">0 Rules</span>
      </div>
      <div class="form-group">
        <label>URL Match Filter Pattern (e.g. *api/v1/user*)</label>
        <input type="text" id="rule-url-pattern" placeholder="*api/checkout*" />
      </div>
      <div class="form-group">
        <label>Fault Action Type</label>
        <select id="rule-action-type">
          <option value="block">Block Network Request (404/Failed)</option>
          <option value="redirect">Redirect Request URL</option>
          <option value="latency">Simulate High Latency (Abort mock)</option>
        </select>
      </div>
      <div class="form-group" id="redirect-url-group" style="display:none;">
        <label>Redirect Target URL</label>
        <input type="text" id="rule-redirect-url" placeholder="https://httpbin.org/status/500" />
      </div>
      <div class="btn-row">
        <button type="button" id="add-fault-rule-btn">➕ Add Fault Rule</button>
        <button type="button" class="secondary danger" id="clear-fault-rules-btn">Clear All Rules</button>
      </div>
      <div class="log-container" id="active-rules-list">
        <div style="color:var(--muted)">No active fault injection rules.</div>
      </div>
    </div>

    <!-- 2. Test State Control & Script Injection -->
    <div class="card">
      <div class="card-title">
        <span>⚙️ Test State Control &amp; Injection</span>
      </div>
      <div class="form-group">
        <label>Mock LocalStorage State Key</label>
        <input type="text" id="state-key" placeholder="user_session" />
      </div>
      <div class="form-group">
        <label>JSON State Payload</label>
        <textarea id="state-json" rows="3" placeholder='{"role": "admin", "token": "mock_qa_token_123"}'></textarea>
      </div>
      <div class="btn-row">
        <button type="button" id="inject-state-btn">Inject Local State</button>
        <button type="button" class="secondary" id="eval-fault-script-btn">Run Custom Fault JS</button>
      </div>
      <div class="form-group" style="margin-top:6px;">
        <label>Custom JS Fault Snippet</label>
        <textarea id="custom-js-snippet" rows="2" placeholder="console.warn('Simulating frontend crash'); throw new Error('QA Fault');"></textarea>
      </div>
    </div>
  </div>

  <!-- 3. Live Flow Capture Stream -->
  <div class="card" style="margin-top: 16px;">
    <div class="card-title">
      <span>📡 Live Flow Capture &amp; Network Stream</span>
      <button type="button" class="secondary" id="clear-flow-log-btn" style="padding:4px 8px;font-size:10px;">Clear Stream</button>
    </div>
    <div class="log-container" id="flow-stream-log">
      <div style="color:var(--muted)">Listening for network flows and DOM events...</div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
