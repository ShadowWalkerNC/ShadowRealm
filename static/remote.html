<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d0d0f">
  <title>ShadowRealm Remote (iPhone)</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #0d0d0f;
      color: #e0e0e0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid #1f1f24;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #7b5cf0, #00e5ff);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #ffffff, #a0a0a5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #00e5ff;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .dot {
      width: 6px;
      height: 6px;
      background-color: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00e5ff;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
      overflow-y: auto;
    }
    .card {
      background: #141418;
      border: 1px solid #24242a;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #888890;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-box {
      background: #1a1a20;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-label {
      font-size: 11px;
      color: #666670;
    }
    .stat-val {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }
    .terminal-output {
      background-color: #08080a;
      border: 1px solid #1f1f26;
      border-radius: 12px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #00e5ff;
      height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .command-bar {
      display: flex;
      gap: 8px;
    }
    .cmd-input {
      flex: 1;
      background-color: #1a1a20;
      border: 1px solid #2a2a32;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      user-select: text;
    }
    .cmd-input:focus {
      border-color: #7b5cf0;
    }
    .btn-send {
      background: linear-gradient(135deg, #7b5cf0, #5c3cf0);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-send:active {
      transform: scale(0.96);
    }
    .quick-actions {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .btn-quick {
      background: #1f1f26;
      border: 1px solid #2e2e38;
      color: #ccc;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn-quick:active {
      background: #2a2a35;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">Ω</div>
      <div class="brand-title">ShadowRealm Mobile</div>
    </div>
    <div class="status-badge">
      <div class="dot"></div>
      <span id="sysStatus">Online</span>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="card-title">Host PC Diagnostics</div>
      <div class="grid-2">
        <div class="stat-box">
          <div class="stat-label">Platform</div>
          <div class="stat-val" id="platVal">Windows</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Active Processes</div>
          <div class="stat-val" id="procVal">--</div>
        </div>
      </div>
    </div>

    <div class="card" style="flex: 1;">
      <div class="card-title">PC Execution Terminal</div>
      <div class="quick-actions">
        <button class="btn-quick" onclick="sendCmd('dir')">📁 List Files</button>
        <button class="btn-quick" onclick="sendCmd('git status')">🌿 Git Status</button>
        <button class="btn-quick" onclick="sendCmd('tasklist')">⚡ Tasks</button>
        <button class="btn-quick" onclick="sendCmd('hostname')">💻 Hostname</button>
      </div>

      <div class="terminal-output" id="termOutput">> ShadowRealm PC Terminal initialized. Ready for commands...</div>

      <div class="command-bar">
        <input type="text" class="cmd-input" id="cmdInput" placeholder="Type PC command..." onkeydown="if(event.key==='Enter') runInputCmd()">
        <button class="btn-send" onclick="runInputCmd()">Run</button>
      </div>
    </div>
  </main>

  <script>
    const term = document.getElementById('termOutput');

    async function fetchStatus() {
      try {
        const res = await fetch('/api/remote/status');
        const data = await res.json();
        document.getElementById('sysStatus').innerText = data.status.toUpperCase();
        document.getElementById('platVal').innerText = data.os;
        document.getElementById('procVal').innerText = data.active_processes;
      } catch (err) {
        document.getElementById('sysStatus').innerText = 'Offline';
      }
    }

    async function sendCmd(cmd) {
      if (!cmd) return;
      term.innerText += `\n\n> ${cmd}\nRunning...`;
      term.scrollTop = term.scrollHeight;

      try {
        const res = await fetch('/api/remote/execute', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ command: cmd })
        });
        const data = await res.json();
        if (data.stdout) {
          term.innerText += `\n${data.stdout}`;
        }
        if (data.stderr) {
          term.innerText += `\n[STDERR]\n${data.stderr}`;
        }
      } catch (err) {
        term.innerText += `\nError executing command: ${err.message}`;
      }
      term.scrollTop = term.scrollHeight;
    }

    function runInputCmd() {
      const input = document.getElementById('cmdInput');
      const val = input.value.trim();
      if (val) {
        sendCmd(val);
        input.value = '';
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 10000);
  </script>
</body>
</html>
